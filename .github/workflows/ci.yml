name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If a new commit lands on the same branch/PR while a run is still in
# progress, cancel the superseded one instead of letting both finish —
# only the latest commit's result actually matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    # Integration tests need a genuinely reachable MongoDB — the same
    # requirement tests/setup.js already documents for local development.
    # Its fallback default (mongodb://localhost:27017/test-db) matches this
    # service exactly, so no extra env configuration is needed here.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # This is the step that would have caught the Resume/EducationForm/
      # ExperienceForm case-sensitivity bugs the moment they were committed:
      # this runner is Linux (case-sensitive), same as every real deploy
      # target, unlike local Windows dev.
      - run: npm run build
